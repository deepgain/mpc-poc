name: deepgain_app
description: "DeepGain — on-device workout planner using a quantized PyTorch fatigue model exported to TFLite."
publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Inference layer
  tflite_flutter: ^0.11.0

  # State management
  flutter_riverpod: ^2.6.1

  # Persistence
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # i18n / formatting
  intl: ^0.19.0

  # Phase 6
  uuid: ^4.5.1
  share_plus: ^10.0.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation. Pinned: build_runner 2.15.0 ships a broken
  # entrypoint (imports refer to packages it doesn't expose); 2.4.13 works
  # cleanly with drift_dev 2.20.x.
  drift_dev: 2.20.3
  build_runner: 2.4.13

  # App icon generation (run: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/golden/

# Generates Android (mipmap densities + adaptive) and iOS (AppIcon.appiconset)
# from a single 1024x1024 source. Re-run after changing the logo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/logo.png"
